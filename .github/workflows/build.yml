name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0   # git describe needs tags, a shallow clone has none

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config \
          libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup vcpkg cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/vcpkg/archives' || '~/.cache/vcpkg/archives' }}
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ matrix.os }}-

    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

    - name: Check the compiler is MSVC
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        where cl.exe || (echo MSVC not on PATH && exit /b 1)

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      run: cmake --preset release -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

    - name: Configure (Linux)
      if: runner.os == 'Linux'
      run: cmake --preset release

    - name: Build
      run: cmake --build --preset release

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: a3texture-cli-${{ runner.os }}
        path: |
          build/release/a3texture-cli
          build/release/a3texture-cli.exe
        if-no-files-found: ignore

    - name: Upload GUI artifact
      uses: actions/upload-artifact@v4
      with:
        name: a3texture-gui-${{ runner.os }}
        path: |
          build/release/a3texture-gui
          build/release/a3texture-gui.exe
        if-no-files-found: ignore

  # Overwritten on every push to main. Prerelease, so GitHub's "Latest" badge
  # never points here and the page keeps one entry rather than one per build.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    # The tag has to move to the new commit and updating a release in place
    # leaves it on the old one, so the whole thing is replaced.
    - name: Replace the previous nightly
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release delete nightly --cleanup-tag -y --repo ${{ github.repository }} || true

    - uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: Nightly (${{ github.sha }})
        prerelease: true
        files: dist/*

  # Cut by hand: git tag v1.1.0 && git push a3Texture v1.1.0
  stable:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        generate_release_notes: true
        make_latest: true
        files: dist/*
