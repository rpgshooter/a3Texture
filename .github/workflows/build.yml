name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '271a5b8850aa50f9a40269cbf3cf414b36e333d6'

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: arma3-paa-cli-windows
        path: build/Release/arma3-paa-cli.exe

    - name: Upload GUI artifact
      uses: actions/upload-artifact@v4
      with:
        name: arma3-paa-gui-windows
        path: build/Release/arma3-paa-gui.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-dev libsquish-dev libpng-dev libglfw3-dev libstb-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF

    - name: Build
      run: cmake --build build --config Release

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: arma3-paa-cli-linux
        path: build/arma3-paa-cli

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Windows CLI
      uses: actions/download-artifact@v4
      with:
        name: arma3-paa-cli-windows
        path: windows-cli

    - name: Download Windows GUI
      uses: actions/download-artifact@v4
      with:
        name: arma3-paa-gui-windows
        path: windows-gui

    - name: Download Linux CLI
      uses: actions/download-artifact@v4
      with:
        name: arma3-paa-cli-linux
        path: linux-cli

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          windows-cli/arma3-paa-cli.exe
          windows-gui/arma3-paa-gui.exe
          linux-cli/arma3-paa-cli
