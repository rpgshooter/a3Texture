name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build pkg-config \
          libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

    - name: Setup Ninja
      if: runner.os == 'Windows'
      uses: seanmiddleditch/gha-setup-ninja@v4

    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

    - name: Configure
      run: cmake --preset release

    - name: Build
      run: cmake --build --preset release

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: arma3-paa-cli-${{ runner.os }}
        path: |
          build/release/arma3-paa-cli
          build/release/arma3-paa-cli.exe
        if-no-files-found: ignore

    - name: Upload GUI artifact
      uses: actions/upload-artifact@v4
      with:
        name: arma3-paa-gui-${{ runner.os }}
        path: |
          build/release/arma3-paa-gui
          build/release/arma3-paa-gui.exe
        if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Windows CLI
      uses: actions/download-artifact@v4
      with:
        name: arma3-paa-cli-Windows
        path: windows-cli

    - name: Download Windows GUI
      uses: actions/download-artifact@v4
      with:
        name: arma3-paa-gui-Windows
        path: windows-gui

    - name: Download Linux CLI
      uses: actions/download-artifact@v4
      with:
        name: arma3-paa-cli-Linux
        path: linux-cli

    - name: Download Linux GUI
      uses: actions/download-artifact@v4
      with:
        name: arma3-paa-gui-Linux
        path: linux-gui

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Build ${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          windows-cli/arma3-paa-cli.exe
          windows-gui/arma3-paa-gui.exe
          linux-cli/arma3-paa-cli
          linux-gui/arma3-paa-gui
